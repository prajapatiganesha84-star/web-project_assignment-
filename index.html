<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="box">
    <h1>Student Expense Tracker</h1>
    <h2>Total Expenses: ₹650</h2>

    <input type="text" placeholder="Expense Name">
    <input type="number" placeholder="Amount">

    <p>Category:</p>
    <ul>
      <li class="active">Food</li>
      <li>Travel</li>
      <li>Shopping</li>
      <li>Education</li>
      <li>Other</li>
    </ul>
    <button>Add Expense</button>

    <hr>

    <h2>Expenses</h2>
    <ul>
      <li class="active">All</li>
      <li>Food</li>
      <li>Travel</li>
      <li>Shopping</li>
      <li>Education</li>
      <li>Other</li>
    </ul>

    <ul id="list">
      <li>Canteen Lunch (Food) - ₹150 <button>Delete</button></li>
      <li>Bus Pass (Travel) - ₹200 <button>Delete</button></li>
      <li>Notebook (Education) - ₹300 <button>Delete</button></li>
    </ul>
   </div>
   
</body>
</html>
